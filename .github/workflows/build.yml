name: Build & Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Cache ktlint
        uses: actions/cache@v4
        with:
          path: ktlint
          key: ktlint-1.7.1

      - name: Setup ktlint
        run: |
          if [ ! -f ktlint ]; then
            curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint
            chmod a+x ktlint
          fi

      - name: Run ktlint
        run: ./ktlint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Dummy keys are enough to compile; see .agents/rules/building.md
      - name: Create local.properties
        run: |
          cat > local.properties <<'PROPS'
          TRAKT_API_KEY="ci-dummy"
          TRAKT_API_SECRET="ci-dummy"
          YOUNIFY_API_KEY="ci-dummy"
          KEYSTORE_ALIAS=ci-dummy
          KEYSTORE_KEY_PASSWORD=ci-dummy
          KEYSTORE_PASSWORD=ci-dummy
          PROPS

      # The repo pins org.gradle.jvmargs=-Xmx2048m, which OOMs the Kotlin
      # daemon on the larger Compose screens; see .agents/rules/building.md
      - name: Raise Gradle and Kotlin daemon heap
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx4g\n' >> ~/.gradle/gradle.properties

      - name: Generate OpenAPI client
        run: ./gradlew openApiGenerate

      # validateStringPlaceholders is skipped due to pre-existing
      # values-ar-rSA mismatches in Crowdin-owned files; see building.md
      - name: Build and check phone app (playstore debug)
        run: >
          ./gradlew
          :app:assemblePlaystoreDebug
          :app:testPlaystoreDebugUnitTest
          -x :resources:validateStringPlaceholders
